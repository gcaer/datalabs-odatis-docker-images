name: notebook
channels:
  - conda-forge
  - nodefaults
dependencies:
  - copernicusmarine
  - eodag
  - eoreader
  - eosets
  - geocube
  - jupytergis>=0.16
  - jupyter-tiler
  - jupyter_app_launcher
  - jupyterlab-favorites
  - openeo
  - pangeo-notebook=2026.10.09 # override base layer: jupytergis>=0.16 needs jupyterlab>=4.6
  - qgis
  - websockify # used by the vnc module (python 3.14 of the base env breaks it)
  - xdem
